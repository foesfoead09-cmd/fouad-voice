name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --console=plain 2>&1 | tee build.log
      - if: failure()
        run: |
          grep -E "^e: |What went wrong|error:" -A3 build.log | head -12 | while read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: FouadVoice-APK
          path: app/build/outputs/apk/debug/app-debug.apk
